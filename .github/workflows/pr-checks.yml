name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install

      - name: Start Playwright Install (background)
        run: |
          nohup bash -c 'bunx playwright install --with-deps; echo $? > /tmp/playwright_exit' > /tmp/playwright.log 2>&1 &
          echo "Playwright install started in background (PID: $!)"

      - name: Run Typecheck and Lint
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run typecheck lint:ci

      - name: Run Non-Playwright Tests
        run: |
          TURBO_TELEMETRY_DISABLED=1 bun turbo run test --filter='!test-playground'
          cd tests/test-playground && bun run test:unit

      - name: Wait for Playwright and Run E2E Tests
        run: |
          echo "Waiting for Playwright install to complete..."
          while [ ! -f /tmp/playwright_exit ]; do
            sleep 2
          done
          EXIT_CODE=$(cat /tmp/playwright_exit)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Playwright install failed"
            cat /tmp/playwright.log
            exit 1
          fi
          echo "Playwright installed successfully"
          TURBO_TELEMETRY_DISABLED=1 bun turbo run test:e2e --filter='test-playground'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            tests/test-playground/playwright-report/
            tests/test-playground/test-results/
          retention-days: 7
