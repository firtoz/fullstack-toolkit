name: Pull Request Checks

permissions:
  contents: read
  actions: write

on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      AI_GATEWAY_NAME:
        required: false
      AI_GATEWAY_TOKEN:
        required: false

# Playwright Docker image tag must match the resolved `playwright` / `@playwright/test`
# version in bun.lock (see catalog). Bump both together when upgrading Playwright.
# Turbo 2 strict env mode does not forward PLAYWRIGHT_BROWSERS_PATH from the image unless
# `test:e2e` lists it in `passThroughEnv` (see root turbo.json); otherwise Playwright looks
# under ~/.cache/ms-playwright and fails in CI.

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match root `packageManager` so CI reproduces local installs; `latest` can diverge and trigger Bun-only crashes.
          bun-version-file: package.json

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck and Lint
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run typecheck lint:ci

      - name: Verify generated files are committed
        run: git diff --exit-code

      # Run one package test at a time: Vitest + @cloudflare/vitest-pool-workers plus other
      # suites in parallel still exceeded ~7GB on ubuntu-latest (SIGKILL exit 137).
      - name: Run Non-Playwright Tests
        run: |
          TURBO_TELEMETRY_DISABLED=1 bun turbo run test --filter='!test-playground' --concurrency=1
          cd tests/test-playground && bun run test:unit
        # Only workflow_call (e.g. release on main) receives these; pull_request / merge_group do not.
        env:
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_call' && secrets.OPENROUTER_API_KEY || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name == 'workflow_call' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          AI_GATEWAY_NAME: ${{ github.event_name == 'workflow_call' && secrets.AI_GATEWAY_NAME || '' }}
          AI_GATEWAY_TOKEN: ${{ github.event_name == 'workflow_call' && secrets.AI_GATEWAY_TOKEN || '' }}

  e2e:
    name: Playwright E2E (test-playground) shard ${{ matrix.shard }}
    needs: checks
    env:
      # Keep in sync with strategy.matrix.shard length (Playwright --shard=i/N).
      PW_SHARD_TOTAL: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      # Browsers + OS deps are in the image; see https://playwright.dev/docs/ci#via-containers
      # --ipc=host: avoid Chromium OOM in Docker (https://playwright.dev/docs/docker#recommended-docker-configuration)
      # Do not set --user: runner must be root here so we can `apt-get install unzip`
      # (required by oven-sh/setup-bun to extract the Bun zip). Browser dirs are world-readable in the image.
      options: --ipc=host --init
    steps:
      - name: Checkout Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # setup-bun downloads bun-linux-x64.zip and shells out to `unzip`; minimal images omit it.
      - name: Install unzip (for setup-bun)
        run: apt-get update && apt-get install -y unzip

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Runner user differs from checkout ownership in containers; Turbo reads git for hashing.
      - name: Git safe.directory (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run E2E Tests
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run test:e2e:shard --filter='test-playground' -- --shard=${{ matrix.shard }}/${{ env.PW_SHARD_TOTAL }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            tests/test-playground/playwright-report/
            tests/test-playground/test-results/
          retention-days: 7
