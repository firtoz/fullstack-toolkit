name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      AI_GATEWAY_NAME:
        required: false
      AI_GATEWAY_TOKEN:
        required: false

# Playwright Docker image tag must match the resolved `playwright` / `@playwright/test`
# version in bun.lock (see catalog). Bump both together when upgrading Playwright.

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match root `packageManager` so CI reproduces local installs; `latest` can diverge and trigger Bun-only crashes.
          bun-version-file: package.json

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install

      - name: Run Typecheck and Lint
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run typecheck lint:ci

      # Run one package test at a time: Vitest + @cloudflare/vitest-pool-workers plus other
      # suites in parallel still exceeded ~7GB on ubuntu-latest (SIGKILL exit 137).
      - name: Run Non-Playwright Tests
        run: |
          TURBO_TELEMETRY_DISABLED=1 bun turbo run test --filter='!test-playground' --concurrency=1
          cd tests/test-playground && bun run test:unit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_GATEWAY_NAME: ${{ secrets.AI_GATEWAY_NAME }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}

  e2e:
    name: Playwright E2E (test-playground)
    needs: checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      # Browsers + OS deps are in the image; see https://playwright.dev/docs/ci#via-containers
      # --ipc=host: avoid Chromium OOM in Docker (https://playwright.dev/docs/docker#recommended-docker-configuration)
      options: --ipc=host --init --user 1001
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Dependencies
        run: bun install

      - name: Run E2E Tests
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run test:e2e --filter='test-playground'

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            tests/test-playground/playwright-report/
            tests/test-playground/test-results/
          retention-days: 7
