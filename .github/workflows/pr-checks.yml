name: Pull Request Checks

# GitHub Actions JavaScript actions run on a Node version tied to the runner; opt into
# Node 24 before the June 2026 default (see GitHub changelog on Node 20 deprecation).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_call:
    secrets:
      OPENROUTER_API_KEY:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      AI_GATEWAY_NAME:
        required: false
      AI_GATEWAY_TOKEN:
        required: false

# Keep reusable checks distinct from the caller's own concurrency group.
concurrency:
  group: toolkit-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Playwright Docker image tag must match the resolved `playwright` / `@playwright/test`
# version in bun.lock (see catalog). Bump both together when upgrading Playwright.
# Turbo 2 strict env mode does not forward PLAYWRIGHT_BROWSERS_PATH from the image unless
# `test:e2e` lists it in `passThroughEnv` (see root turbo.json); otherwise Playwright looks
# under ~/.cache/ms-playwright and fails in CI.

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel obsolete checks for this pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: current } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId,
            });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: current.workflow_id,
              event: "pull_request", per_page: 100,
            });
            for (const run of data.workflow_runs) {
              if (run.run_number >= current.run_number ||
                  run.head_sha === pr.head.sha ||
                  run.status === "completed" ||
                  !run.pull_requests.some(item => item.number === pr.number)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo, run_id: run.id,
                });
                core.info("Cancelled obsolete check run " + run.id);
              } catch {
                core.warning("Could not cancel obsolete check run " + run.id);
              }
            }

      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.22.1"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Match root `packageManager` so CI reproduces local installs; `latest` can diverge and trigger Bun-only crashes.
          bun-version-file: package.json

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependency security
        run: bun audit

      - name: Smoke patched Worker runtimes and MCP SDK
        run: node scripts/dependency-smoke.mjs

      - name: Check standalone published-package fixtures
        run: |
          for fixture in node-smoke react-router-smoke cf-worker-smoke; do
            bun install --cwd "tests/published-smoke/$fixture" --frozen-lockfile
            bun audit --cwd "tests/published-smoke/$fixture"
            bun run --cwd "tests/published-smoke/$fixture" smoke
          done

      - name: Run Typecheck and Lint
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run typecheck lint:ci

      - name: Verify generated files are committed
        run: git diff --exit-code

      # Run one package test at a time: Vitest + @cloudflare/vitest-pool-workers plus other
      # suites in parallel still exceeded ~7GB on ubuntu-latest (SIGKILL exit 137).
      - name: Run Non-Playwright Tests
        run: |
          TURBO_TELEMETRY_DISABLED=1 bun turbo run test --filter='!test-playground-collections' --filter='!test-playground-router' --concurrency=1
          cd tests/test-playground-collections && bun run test:unit
          cd ../test-playground-router && bun run test:unit
        # Only workflow_call (e.g. release on main) receives these; pull_request / merge_group do not.
        env:
          OPENROUTER_API_KEY: ${{ github.event_name == 'workflow_call' && secrets.OPENROUTER_API_KEY || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event_name == 'workflow_call' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          AI_GATEWAY_NAME: ${{ github.event_name == 'workflow_call' && secrets.AI_GATEWAY_NAME || '' }}
          AI_GATEWAY_TOKEN: ${{ github.event_name == 'workflow_call' && secrets.AI_GATEWAY_TOKEN || '' }}

  e2e:
    name: Playwright E2E ${{ matrix.playground }} shard ${{ matrix.shard }}
    needs: checks
    env:
      # Keep in sync with strategy.matrix.shard length (Playwright --shard=i/N).
      PW_SHARD_TOTAL: 4
    strategy:
      fail-fast: false
      matrix:
        playground: [test-playground-collections, test-playground-router]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      # Browsers + OS deps are in the image; see https://playwright.dev/docs/ci#via-containers
      # --ipc=host: avoid Chromium OOM in Docker (https://playwright.dev/docs/docker#recommended-docker-configuration)
      options: --ipc=host --init
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # npm extracts its tarballs in-process; no apt/unzip setup is needed.
      - name: Use patched project Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pinned Bun without system package dependencies
        shell: bash
        run: |
          BUN_VERSION="$(node -e 'const match = /^bun@(\d+\.\d+\.\d+)$/.exec(require("./package.json").packageManager); if (!match) throw Error("Expected a numeric bun@ packageManager"); process.stdout.write(match[1]);')"
          test "$(node -p 'require("./.github/bun-bootstrap/package.json").dependencies.bun')" = "$BUN_VERSION"
          npm ci --prefix .github/bun-bootstrap --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/bun-bootstrap/node_modules/.bin" >> "$GITHUB_PATH"
          test "$(.github/bun-bootstrap/node_modules/.bin/bun --version)" = "$BUN_VERSION"
          test "$(.github/bun-bootstrap/node_modules/.bin/bunx --version)" = "$BUN_VERSION"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # Runner user differs from checkout ownership in containers; Turbo reads git for hashing.
      - name: Git safe.directory (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run E2E Tests
        run: TURBO_TELEMETRY_DISABLED=1 bun turbo run test:e2e:shard --filter='${{ matrix.playground }}' -- --shard=${{ matrix.shard }}/${{ env.PW_SHARD_TOTAL }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.playground }}-shard-${{ matrix.shard }}
          path: |
            tests/${{ matrix.playground }}/playwright-report/
            tests/${{ matrix.playground }}/test-results/
          retention-days: 7
